<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Board</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <main class="max-w-5xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-bold mb-2">Finance roles in India</h1>
    <p class="text-gray-500 mb-6">
      India-based or remote finance roles, pulled live from each company's careers page --
      every listing here has already been filtered to finance / finance-related roles only.
    </p>

    <div class="flex gap-1 border-b border-gray-200 mb-6">
      <button data-tab="company" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-red-700 text-red-700">
        By company
      </button>
      <button data-tab="all" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">
        All jobs
      </button>
    </div>

    <div id="view-company">
      <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <p id="emptyCompany" class="hidden text-gray-400 text-center py-16">No open finance roles indexed right now -- check back soon.</p>
    </div>

    <div id="view-all" class="hidden">
      <input id="searchBox" type="text" placeholder="Search by title, company, or location..."
        class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-red-500/30" />
      <div id="allGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <p id="emptyAll" class="hidden text-gray-400 text-center py-16">No jobs match your search.</p>
    </div>
  </main>

  <div id="modalBackdrop" class="hidden fixed inset-0 bg-black/40 flex items-start justify-center p-6 z-50 overflow-y-auto">
    <div class="bg-white rounded-xl max-w-3xl w-full mt-12 max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
        <h3 id="modalTitle" class="font-semibold"></h3>
        <button id="modalClose" class="text-gray-400 hover:text-gray-700 text-xl leading-none">&times;</button>
      </div>
      <div id="modalBody" class="overflow-y-auto px-5 py-5 grid sm:grid-cols-2 gap-3"></div>
    </div>
  </div>

<script>
const API = "";
let allJobsCache = [];

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

function jobCard(j, showCompany) {
  const title = escapeHtml(j.title || "Untitled role");
  const badges = [
    j.location ? `<span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">${escapeHtml(j.location)}</span>` : "",
    j.department ? `<span class="text-xs bg-red-50 text-red-700 px-2 py-0.5 rounded-full">${escapeHtml(j.department)}</span>` : "",
  ].filter(Boolean).join(" ");

  const applyBtn = j.url
    ? `<a href="${escapeHtml(j.url)}" target="_blank" rel="noopener" class="mt-3 inline-flex items-center justify-center text-xs font-medium bg-gray-900 hover:bg-red-700 text-white rounded-lg px-3 py-2 transition">View &amp; Apply</a>`
    : `<div class="mt-3 text-xs text-gray-300">No link available</div>`;

  return `
    <div class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col justify-between hover:border-red-300 hover:shadow-sm transition">
      <div>
        <div class="font-semibold text-sm text-gray-900 line-clamp-2">${title}</div>
        ${showCompany ? `<div class="text-xs text-gray-400 mt-1">${escapeHtml(j.company)}</div>` : ""}
        ${badges ? `<div class="flex flex-wrap gap-1.5 mt-2">${badges}</div>` : ""}
      </div>
      ${applyBtn}
    </div>`;
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => {
      b.classList.remove("border-red-700", "text-red-700");
      b.classList.add("border-transparent", "text-gray-500");
    });
    btn.classList.add("border-red-700", "text-red-700");
    btn.classList.remove("border-transparent", "text-gray-500");

    document.getElementById("view-company").classList.toggle("hidden", btn.dataset.tab !== "company");
    document.getElementById("view-all").classList.toggle("hidden", btn.dataset.tab !== "all");
  });
});

async function loadCompanies() {
  const res = await fetch(`${API}/api/board`);
  const companies = await res.json();
  const grid = document.getElementById("grid");
  const empty = document.getElementById("emptyCompany");
  grid.innerHTML = "";

  const withJobs = companies.filter(c => c.job_count > 0);
  empty.classList.toggle("hidden", withJobs.length !== 0);

  for (const c of withJobs) {
    const card = document.createElement("button");
    card.className = "text-left bg-white border border-gray-200 rounded-xl p-5 hover:border-red-300 hover:shadow-sm transition";
    card.innerHTML = `
      <div class="font-semibold text-gray-900">${escapeHtml(c.company)}</div>
      <div class="text-2xl font-bold text-red-700 mt-2">${c.job_count}</div>
      <div class="text-xs text-gray-400 mt-1">finance role${c.job_count === 1 ? "" : "s"} in India / remote</div>
    `;
    card.addEventListener("click", () => openCompanyModal(c.id, c.company));
    grid.appendChild(card);
  }
}

async function openCompanyModal(id, company) {
  const res = await fetch(`${API}/api/companies/${id}/jobs`);
  const jobs = await res.json();
  document.getElementById("modalTitle").textContent = `${company} -- ${jobs.length} role${jobs.length === 1 ? "" : "s"}`;
  document.getElementById("modalBody").innerHTML = jobs.length
    ? jobs.map(j => jobCard(j, false)).join("")
    : `<p class="col-span-2 text-gray-400 text-sm py-6 text-center">No individual listings indexed for this source yet.</p>`;
  document.getElementById("modalBackdrop").classList.remove("hidden");
}

document.getElementById("modalClose").addEventListener("click", () => {
  document.getElementById("modalBackdrop").classList.add("hidden");
});
document.getElementById("modalBackdrop").addEventListener("click", (e) => {
  if (e.target.id === "modalBackdrop") document.getElementById("modalBackdrop").classList.add("hidden");
});

async function loadAllJobs() {
  const res = await fetch(`${API}/api/jobs`);
  allJobsCache = await res.json();
  renderAllJobs(allJobsCache);
}

function renderAllJobs(jobs) {
  const grid = document.getElementById("allGrid");
  const empty = document.getElementById("emptyAll");
  grid.innerHTML = jobs.map(j => jobCard(j, true)).join("");
  empty.classList.toggle("hidden", jobs.length !== 0);
}

document.getElementById("searchBox").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return renderAllJobs(allJobsCache);
  renderAllJobs(allJobsCache.filter(j =>
    (j.title || "").toLowerCase().includes(q) ||
    (j.company || "").toLowerCase().includes(q) ||
    (j.location || "").toLowerCase().includes(q)
  ));
});

loadCompanies();
loadAllJobs();
setInterval(() => { loadCompanies(); loadAllJobs(); }, 30000);
</script>
</body>
</html>
