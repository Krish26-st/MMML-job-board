version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./job_board.db:/app/job_board.db

  # Concurrency is pinned to 1 worker process here, AND the sync-all task
  # chains sources sequentially -- so only one Playwright/Chromium instance
  # is ever alive at once, no matter how this is scaled.
  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./job_board.db:/app/job_board.db

  beat:
    build: .
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
