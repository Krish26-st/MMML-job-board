databases:
  - name: mmml-job-board-db
    plan: free
    databaseName: mmml_job_board
    user: mmml

# Render's free plan doesn't offer the "Background Worker" service type at
# all (that's what "service type is not available for this plan" means) --
# only Web Services have a free tier. So there's a single service here: the
# Celery worker and beat run as background processes inside the same
# container as the web app (see start.sh / Dockerfile), all under Render's
# one free Web Service.
#
# REDIS_URL is a secret (sync: false) -- Render will prompt for it during
# Blueprint setup. Paste in a free external Redis URL (Upstash works well;
# see the README's "Deploying" section) since Render also caps free
# accounts at 1 free Redis instance total.
services:
  - type: web
    name: mmml-job-board-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mmml-job-board-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
